<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw payroll review flow</title>
  <desc id="desc">Dark mode flow diagram showing incoming payroll files moving through OpenClaw, local review tools, evidence outputs, and finance review.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2bd6"/>
      <stop offset="100%" stop-color="#7b2cff"/>
    </linearGradient>

    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15151d"/>
      <stop offset="100%" stop-color="#0f0f15"/>
    </linearGradient>

    <filter id="cardShadow" x="-12%" y="-18%" width="124%" height="136%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.34"/>
    </filter>

    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ff2bd6"/>
    </marker>

    <style>
      .canvas { fill: #050507; }
      .frame { fill: #09090d; stroke: #2a1f3d; stroke-width: 1.2; }
      .card { fill: url(#panelFill); stroke: #2a1f3d; stroke-width: 1.3; filter: url(#cardShadow); }
      .card-strong { fill: url(#panelFill); stroke: url(#accent); stroke-width: 1.7; filter: url(#cardShadow); }
      .label { font: 700 18px Arial, sans-serif; fill: #f5f1ff; letter-spacing: 0; }
      .sub { font: 14px Arial, sans-serif; fill: #c7bddb; }
      .small { font: 12px Arial, sans-serif; fill: #a79abf; }
      .line { stroke: url(#accent); stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="canvas" width="1200" height="420"/>
  <rect class="frame" x="32" y="42" width="1136" height="336" rx="20"/>

  <rect class="card" x="72" y="134" width="212" height="122" rx="8"/>
  <rect x="72" y="134" width="212" height="4" fill="url(#accent)" rx="2"/>
  <text class="label" x="96" y="178">Incoming payroll</text>
  <text class="sub" x="96" y="208">current + previous</text>

  <rect class="card-strong" x="352" y="120" width="224" height="150" rx="8"/>
  <text class="label" x="380" y="166">OpenClaw</text>
  <text class="sub" x="380" y="196">detects files</text>
  <text class="sub" x="380" y="220">runs approved wrapper</text>

  <rect class="card" x="644" y="134" width="252" height="122" rx="8"/>
  <rect x="644" y="134" width="252" height="4" fill="url(#accent)" rx="2"/>
  <text class="label" x="670" y="178">Review engine</text>
  <text class="sub" x="670" y="208">extract -> reconcile -> detect</text>

  <rect class="card" x="264" y="306" width="252" height="76" rx="8"/>
  <text class="label" x="290" y="342">Evidence pack</text>
  <text class="small" x="290" y="364">workbook, summary, receipt, manifest</text>

  <rect class="card" x="684" y="306" width="252" height="76" rx="8"/>
  <text class="label" x="710" y="342">Finance review</text>
  <text class="small" x="710" y="364">approve, reject, or raise queries</text>

  <path class="line" d="M284 195 H338"/>
  <path class="line" d="M576 195 H630"/>
  <path class="line" d="M770 256 V286 H390 V296"/>
  <path class="line" d="M516 344 H670"/>
</svg>
