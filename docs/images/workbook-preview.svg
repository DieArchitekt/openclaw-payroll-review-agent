<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Payroll review workbook preview</title>
  <desc id="desc">A restrained monochrome preview of the generated payroll review workbook sheets.</desc>
  <rect width="1100" height="520" fill="#ffffff"/>
  <style>
    .frame { fill: #ffffff; stroke: #1f2933; stroke-width: 1.4; rx: 4; }
    .tab { fill: #f3f4f6; stroke: #1f2933; stroke-width: 1.1; rx: 3; }
    .active { fill: #ffffff; stroke: #111827; stroke-width: 1.5; rx: 3; }
    .head { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1; }
    .line { stroke: #d1d5db; stroke-width: 1; }
    .title { font: 600 20px Arial, sans-serif; fill: #111827; }
    .label { font: 600 14px Arial, sans-serif; fill: #111827; }
    .text { font: 13px Arial, sans-serif; fill: #374151; }
    .muted { font: 12px Arial, sans-serif; fill: #6b7280; }
  </style>

  <text x="50" y="50" class="title">Generated review workbook</text>
  <text x="50" y="76" class="muted">Structured sheets for review, reconciliation, exceptions, metadata, and approval evidence</text>

  <rect x="50" y="105" width="1000" height="340" class="frame"/>

  <rect x="75" y="130" width="130" height="34" class="tab"/>
  <text x="95" y="152" class="text">Summary</text>
  <rect x="215" y="130" width="150" height="34" class="active"/>
  <text x="235" y="152" class="label">Anomalies</text>
  <rect x="375" y="130" width="165" height="34" class="tab"/>
  <text x="395" y="152" class="text">Reconciliation</text>
  <rect x="550" y="130" width="140" height="34" class="tab"/>
  <text x="570" y="152" class="text">Approval</text>
  <rect x="700" y="130" width="180" height="34" class="tab"/>
  <text x="720" y="152" class="text">Run Metadata</text>

  <rect x="75" y="195" width="950" height="42" class="head"/>
  <text x="95" y="221" class="label">Severity</text>
  <text x="230" y="221" class="label">Category</text>
  <text x="430" y="221" class="label">Field</text>
  <text x="585" y="221" class="label">Change</text>
  <text x="720" y="221" class="label">Message</text>

  <line x1="75" y1="275" x2="1025" y2="275" class="line"/>
  <line x1="75" y1="315" x2="1025" y2="315" class="line"/>
  <line x1="75" y1="355" x2="1025" y2="355" class="line"/>
  <line x1="75" y1="395" x2="1025" y2="395" class="line"/>

  <text x="95" y="262" class="text">HIGH</text>
  <text x="230" y="262" class="text">Missing employee</text>
  <text x="430" y="262" class="text">Employee</text>
  <text x="585" y="262" class="text">n/a</text>
  <text x="720" y="262" class="text">Present previously, missing currently</text>

  <text x="95" y="302" class="text">HIGH</text>
  <text x="230" y="302" class="text">Net pay movement</text>
  <text x="430" y="302" class="text">NetPay</text>
  <text x="585" y="302" class="text">508.7%</text>
  <text x="720" y="302" class="text">Movement exceeds configured threshold</text>

  <text x="95" y="342" class="text">MEDIUM</text>
  <text x="230" y="342" class="text">PAYE movement</text>
  <text x="430" y="342" class="text">PAYE</text>
  <text x="585" y="342" class="text">24.0%</text>
  <text x="720" y="342" class="text">Review tax movement against gross pay</text>
</svg>
