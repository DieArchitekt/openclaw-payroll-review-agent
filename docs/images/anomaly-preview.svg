<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Payroll anomaly preview</title>
  <desc id="desc">A compact monochrome preview of payroll review anomalies grouped by severity and category.</desc>
  <rect width="1100" height="360" fill="#ffffff"/>
  <style>
    .panel { fill: #ffffff; stroke: #1f2933; stroke-width: 1.4; rx: 4; }
    .head { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1; }
    .line { stroke: #d1d5db; stroke-width: 1; }
    .title { font: 600 20px Arial, sans-serif; fill: #111827; }
    .label { font: 600 14px Arial, sans-serif; fill: #111827; }
    .text { font: 13px Arial, sans-serif; fill: #374151; }
    .muted { font: 12px Arial, sans-serif; fill: #6b7280; }
  </style>

  <text x="50" y="50" class="title">Anomaly review excerpt</text>
  <text x="50" y="76" class="muted">Example exception evidence generated from sample payroll data</text>

  <rect x="50" y="110" width="1000" height="190" class="panel"/>
  <rect x="50" y="110" width="1000" height="42" class="head"/>
  <text x="75" y="136" class="label">Severity</text>
  <text x="205" y="136" class="label">Category</text>
  <text x="415" y="136" class="label">Employee</text>
  <text x="620" y="136" class="label">Field</text>
  <text x="760" y="136" class="label">Message</text>

  <line x1="50" y1="190" x2="1050" y2="190" class="line"/>
  <line x1="50" y1="230" x2="1050" y2="230" class="line"/>
  <line x1="50" y1="270" x2="1050" y2="270" class="line"/>

  <text x="75" y="176" class="text">HIGH</text>
  <text x="205" y="176" class="text">Missing employee</text>
  <text x="415" y="176" class="text">Sample Employee</text>
  <text x="620" y="176" class="text">Employee</text>
  <text x="760" y="176" class="text">Present previously, missing currently</text>

  <text x="75" y="216" class="text">HIGH</text>
  <text x="205" y="216" class="text">Negative value</text>
  <text x="415" y="216" class="text">Sample Employee</text>
  <text x="620" y="216" class="text">NetPay</text>
  <text x="760" y="216" class="text">Negative payroll amount requires review</text>

  <text x="75" y="256" class="text">MEDIUM</text>
  <text x="205" y="256" class="text">Pension check</text>
  <text x="415" y="256" class="text">Sample Employee</text>
  <text x="620" y="256" class="text">Pension</text>
  <text x="760" y="256" class="text">Expected pension value missing</text>
</svg>
