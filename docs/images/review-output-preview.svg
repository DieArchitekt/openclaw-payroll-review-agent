<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Review output preview</title>
  <desc id="desc">A monochrome preview of generated payroll review outputs, including workbook, summary, receipt and manifest files.</desc>
  <rect width="1200" height="640" fill="#ffffff"/>
  <style>
    .panel { fill: #ffffff; stroke: #1f2933; stroke-width: 1.5; rx: 5; }
    .header { fill: #f3f4f6; stroke: #1f2933; stroke-width: 1.5; }
    .title { font: 600 22px Arial, sans-serif; fill: #111827; }
    .label { font: 600 16px Arial, sans-serif; fill: #111827; }
    .text { font: 14px Arial, sans-serif; fill: #374151; }
    .mono { font: 14px Consolas, "Courier New", monospace; fill: #111827; }
    .muted { font: 13px Arial, sans-serif; fill: #6b7280; }
    .rule { stroke: #d1d5db; stroke-width: 1; }
  </style>

  <text x="60" y="58" class="title">Example review outputs</text>
  <text x="60" y="86" class="muted">Generated from sample payroll data through the CLI workflow</text>

  <rect x="60" y="125" width="500" height="210" class="panel"/>
  <rect x="60" y="125" width="500" height="42" class="header"/>
  <text x="85" y="152" class="label">Generated files</text>
  <text x="85" y="205" class="mono">readme_check_review.xlsx</text>
  <text x="85" y="235" class="mono">readme_check_summary.json</text>
  <text x="85" y="265" class="mono">readme_check_receipt.json</text>
  <text x="85" y="295" class="mono">readme_check_manifest.json</text>

  <rect x="640" y="125" width="500" height="210" class="panel"/>
  <rect x="640" y="125" width="500" height="42" class="header"/>
  <text x="665" y="152" class="label">Review status</text>
  <text x="665" y="205" class="text">Run status: completed_with_exceptions</text>
  <text x="665" y="235" class="text">Human action required: true</text>
  <text x="665" y="265" class="text">Ready for approval: false</text>
  <text x="665" y="295" class="text">Recommended action: review HIGH anomalies</text>

  <rect x="60" y="385" width="1080" height="175" class="panel"/>
  <rect x="60" y="385" width="1080" height="42" class="header"/>
  <text x="85" y="412" class="label">Receipt excerpt</text>
  <text x="85" y="462" class="mono">{</text>
  <text x="115" y="492" class="mono">"agent_mode": "read_only_review",</text>
  <text x="115" y="522" class="mono">"source_files_modified": false,</text>
  <text x="115" y="552" class="mono">"approval_performed_by_agent": false</text>
  <text x="85" y="582" class="mono">}</text>
</svg>
